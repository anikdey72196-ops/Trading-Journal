services:
  - type: web
    name: tradelytics
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir app/routes app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tradelytics-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: tradelytics-db
    databaseName: tradelytics
    user: tradelytics_user
    plan: free
